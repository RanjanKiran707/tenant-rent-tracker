<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent Book – UI Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1b2430; --muted:#5b6675; --line:#d9dfe6;
    --primary:#1d4ed8; --primary-ink:#fff; --danger:#b42318;
    --st-pending:#475569;  --st-pending-bg:#e8edf3;
    --st-completed:#14683a; --st-completed-bg:#d9f5e4;
    --st-lateCompleted:#0f6b6b; --st-lateCompleted-bg:#d3f3f1;
    --st-partial:#8a5a00; --st-partial-bg:#fdeec2;
    --st-partialOverdue:#a14200; --st-partialOverdue-bg:#ffe0c7;
    --st-overdue:#b42318; --st-overdue-bg:#fde0dd;
    --st-backlog:#6b21a8; --st-backlog-bg:#ecdcfa;
    --st-backlogCleared:#1e5aa8; --st-backlogCleared-bg:#dbe9fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Noto Sans','Noto Sans Kannada',system-ui,sans-serif;font-size:18px;color:var(--ink);background:#dfe4ea;min-height:100vh;display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px}
  .side{width:260px;font-size:15px;color:#33404f;background:#fff;border-radius:16px;padding:16px;position:sticky;top:24px}
  .side h2{margin:0 0 8px;font-size:17px}
  .side label{display:block;margin:12px 0 4px;font-weight:600}
  .side input{width:100%;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px}
  .side button{margin-top:12px;padding:8px 12px;font-size:14px;border-radius:8px;border:1px solid var(--line);background:#f4f6f8;cursor:pointer}
  .side p{margin:10px 0 0;line-height:1.4}

  .phone{position:relative;width:390px;height:800px;border:10px solid #111;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.25)}
  header.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);min-height:68px}
  header.top .title{flex:1;font-size:21px;font-weight:700;line-height:1.2;user-select:none}
  .icon-btn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;padding:0 10px;font-family:inherit}
  .icon-btn.lang{background:#eef3ff;border-color:#b9ccff;color:var(--primary)}
  .icon-btn.back{font-size:20px}
  main.screen{flex:1;overflow-y:auto;padding:16px 16px 28px}
  nav.bottom{display:flex;background:#fff;border-top:1px solid var(--line)}
  nav.bottom button{flex:1;min-height:64px;border:0;background:#fff;font-family:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  nav.bottom button .ic{font-size:24px}
  nav.bottom button.on{color:var(--primary);box-shadow:inset 0 3px 0 var(--primary)}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 16px;border-radius:16px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;text-align:center}
  .btn.secondary{background:#fff;color:var(--primary)}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
  .btn.small{min-height:48px;font-size:17px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
  .card.tap{cursor:pointer;display:block;width:100%;text-align:left;font-family:inherit;color:inherit;font-size:inherit}
  .card.tap:active{background:#eef3ff}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .name{font-size:21px;font-weight:700}
  .sub{font-size:16px;color:var(--muted);margin-top:2px}
  h2.sec{font-size:19px;margin:22px 0 0}
  .tip{background:#fff8dc;border:1px solid #f0dc8a;border-radius:14px;padding:10px 12px;font-size:16px;margin-bottom:4px}
  .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sum .box{border-radius:18px;padding:12px 14px}
  .sum .lbl{font-size:15px;font-weight:600}
  .sum .val{font-size:26px;font-weight:700;margin-top:2px}
  .box.green{background:var(--st-completed-bg);color:var(--st-completed)}
  .box.amber{background:var(--st-partial-bg);color:var(--st-partial)}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:16px;font-weight:700;white-space:nowrap}
  .chip.pending{background:var(--st-pending-bg);color:var(--st-pending)}
  .chip.completed{background:var(--st-completed-bg);color:var(--st-completed)}
  .chip.lateCompleted{background:var(--st-lateCompleted-bg);color:var(--st-lateCompleted)}
  .chip.partial{background:var(--st-partial-bg);color:var(--st-partial)}
  .chip.partialOverdue{background:var(--st-partialOverdue-bg);color:var(--st-partialOverdue)}
  .chip.overdue{background:var(--st-overdue-bg);color:var(--st-overdue)}
  .chip.backlog{background:var(--st-backlog-bg);color:var(--st-backlog)}
  .chip.backlogCleared{background:var(--st-backlogCleared-bg);color:var(--st-backlogCleared)}
  .olddue{display:inline-block;margin-top:6px;font-size:15px;font-weight:700;color:var(--st-backlog)}

  label.f{display:block;font-weight:700;margin-top:18px}
  .hint{font-size:15px;color:var(--muted);margin:2px 0 6px}
  input.in,select.in{width:100%;min-height:56px;font-size:20px;padding:8px 12px;border:2px solid #aab4c0;border-radius:14px;background:#fff;font-family:inherit;color:var(--ink)}
  input.in:focus,select.in:focus{outline:3px solid #9db8ff;border-color:var(--primary)}
  .err{color:var(--danger);font-weight:700;font-size:16px;margin-top:6px}
  .ok{color:var(--st-completed);font-weight:700;font-size:16px;margin-top:8px}
  .info{background:#eef3ff;border:1px solid #c5d5ff;border-radius:14px;padding:10px 12px;font-size:16px;margin-top:12px}

  .bar{height:12px;background:#e5e9ef;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
  .hist{padding:10px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .m{font-weight:700}

  .choice{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;color:var(--ink)}
  .choice.on{border-color:var(--primary);background:#eef3ff;color:var(--primary)}
  .dot{width:24px;height:24px;border-radius:50%;border:3px solid #aab4c0;flex:none}
  .choice.on .dot{border-color:var(--primary);background:radial-gradient(var(--primary) 45%,transparent 50%)}
  .switch{width:60px;height:34px;border-radius:99px;background:#b7c0cb;position:relative;flex:none;border:0;cursor:pointer}
  .switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--primary)}
  .switch.on::after{left:30px}

  .overlay{position:absolute;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .dialog{background:#fff;border-radius:22px;padding:20px;width:100%;max-height:90%;overflow:auto}
  .dialog h3{margin:0 0 8px;font-size:22px}
  .dialog p{margin:8px 0;line-height:1.45}
  .legend{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .legend div{font-size:16px;line-height:1.35}
  .toast{position:absolute;left:12px;right:12px;bottom:84px;background:#1b2430;color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;z-index:30}
  .toast button{background:#fff;color:#1b2430;border:0;border-radius:10px;min-height:44px;padding:0 14px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.5}
  .welcome{display:flex;flex-direction:column;height:100%;justify-content:center;text-align:center;padding:10px}
  .welcome .big{font-size:84px;margin-bottom:8px}
  .welcome h1{margin:0 0 10px;font-size:30px}
  .welcome p{font-size:20px;line-height:1.5;color:var(--muted);margin:0 0 20px}
  .dots{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}
  .dots i{width:12px;height:12px;border-radius:50%;background:#c3ccd7}
  .dots i.on{background:var(--primary)}
  .banner{background:#ecdcfa;color:#4b1478;border-radius:14px;padding:10px 12px;font-weight:700;font-size:16px}

  @media (max-width:760px){
    body{padding:0;display:block;background:var(--bg)}
    .side{display:none}
    .phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
  }
</style>
</head>
<body>

<aside class="side">
  <h2>Mockup controls</h2>
  <p>This is a design preview. Nothing is saved to a server.</p>
  <label for="demoDate">Pretend today is:</label>
  <input type="date" id="demoDate" onchange="setToday(this.value)">
  <p>Change the date to see how the status tags change (for example, move past the due day or past month end).</p>
  <button onclick="resetDemo()">Reset sample data</button>
</aside>

<div class="phone" id="phone"></div>

const pad = n => String(n).padStart(2,"0");

const addMonth = (ym,n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7)-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };

/* =========================== STATE RULES (from specs.md) =========================== */
function paidAsOf(m, today){ return m.payments.filter(p => p.date <= today).reduce((s,p)=>s+p.amount,0); }
function computeState(m, dueDay, today){
  const paid = paidAsOf(m, today), req = m.required;
  const due = dueDateOf(m.ym, dueDay), end = endOf(m.ym);
  if (paid >= req){
    let run = 0, reached = "";
    for (const p of m.payments.filter(p=>p.date<=today).sort((a,b)=>a.date<b.date?-1:1)){ run += p.amount; if (run >= req){ reached = p.date; break; } }
    if (reached <= due) return "completed";
    if (reached <= end) return "lateCompleted";
    return "backlogCleared";
  }
  if (today > end) return "backlog";
  if (today > due) return paid === 0 ? "overdue" : "partialOverdue";
  return paid === 0 ? "pending" : "partial";
}

const t = (k, v={}) => { let s = (T[S.lang][k] ?? T.en[k] ?? k); for (const x in v) s = s.split("{"+x+"}").join(v[x]); return s; };
const curYm = () => ymOf(S.today);
const findTenant = id => S.tenants.find(x=>x.id===id) || S.archived.find(x=>x.id===id);
const findGroup = id => S.groups.find(g=>g.id===id);                          // includes deleted groups (archived tenants still point at them)
const liveGroups = () => S.groups.filter(g=>!g.deleted);
const groupLabel = g => g.locked ? t("uncategorized") : g.name;          // Uncategorized is translated, the others show what the user typed
const tenantsOf = gid => S.tenants.filter(tn=>tn.groupId===gid);          // active tenants only
const sameName = (a,b) => a.trim().toLowerCase() === b.trim().toLowerCase();

function ensureMonths(tn){
  const cur = curYm();
  let last = tn.months[tn.months.length-1].ym;
  while (last < cur){
    last = addMonth(last,1);
    if (tn.pendingRent && last >= tn.pendingRent.from){ tn.rent = tn.pendingRent.amount; tn.pendingRent = null; }
    tn.months.push({ym:last, required:tn.rent, payments:[]});
  }
}
const visibleMonths = tn => tn.months.filter(m => m.ym <= curYm() && m.ym >= tn.start);
const monthOf = (tn, ym) => tn.months.find(m=>m.ym===ym);
const stateOf = (tn, m) => computeState(m, tn.dueDay, S.today);
const remaining = (m) => Math.max(0, m.required - paidAsOf(m, S.today));
function oldDues(tn){ return visibleMonths(tn).filter(m=>m.ym<curYm()).reduce((s,m)=>s+remaining(m),0); }

/* =========================== NAVIGATION =========================== */
function go(screen, param=null, opts={}){
  if (opts.reset) S.stack = []; else S.stack.push({screen:S.screen, param:S.param});
  S.screen = screen; S.param = param; S.err = "";
  if (screen==="add") S.f = {name:"", rent:"", due:"5", start:curYm(), group: param ?? 0};   // default = the group you came from
  if (screen==="addGroup") S.f = {gname:""};
  if (screen==="renameGroup") S.f = {gname: findGroup(param).name};
  if (screen==="pay") initPay(param);
  if (screen==="rent") S.f = {rent:""};
  render(); const m = document.querySelector("main.screen"); if (m) m.scrollTop = 0;
}
function back(){ const p = S.stack.pop(); S.screen = p ? p.screen : "home"; S.param = p ? p.param : null; S.err=""; render(); }
function tab(name){ go(name, null, {reset:true}); }

/* =========================== SMALL PIECES =========================== */
const chip = st => `<span class="chip ${st}">${t("st_"+st)}</span>`;
const tip = k => S.tips ? `<div class="tip"> ${t(k)}</div>` : "";
function setLang(l){ S.lang = l; localStorage.setItem("rb_lang", l); document.documentElement.lang = l; render(); }
function toggleLang(){ setLang(S.lang==="en" ? "kn" : "en"); }
function toast(msg, undo){ S.toast = {msg, undo}; clearTimeout(S.toastT); S.toastT = setTimeout(()=>{S.toast=null; render();}, undo?7000:2800); }
function setToday(v){ if (v){ S.today = v; render(); } }
function resetDemo(){ Object.assign(S, sampleData(), {stack:[], screen:"home", param:null, toast:null, dialog:null}); render(); }

/* =========================== SCREENS =========================== */
/* One row per tenant of [list], most urgent first (the same order Home used before groups). */
function tenantRows(list){
  list.forEach(ensureMonths);
  const rows = list.map(tn => { const m = monthOf(tn, curYm()); return {tn, m, st:stateOf(tn,m), old:oldDues(tn)}; });
  const rank = r => RANK[r.st] - (r.old>0 ? 0.5 : 0);
  rows.sort((a,b)=> rank(a) - rank(b) || a.tn.name.localeCompare(b.tn.name));
  return rows;
}
const sumPaid = rows => rows.reduce((s,r)=>s+paidAsOf(r.m,S.today),0);
const sumDue  = rows => rows.reduce((s,r)=>s+remaining(r.m),0);

/* HOME: groups instead of tenants. The totals on top still cover every tenant. */
function screenHome(){
  const all = tenantRows(S.tenants);
  // Uncategorized is only listed while it has tenants; every other group is listed even when empty.
  const groups = liveGroups().filter(g => !g.locked || tenantsOf(g.id).length).map(g => {
    const rows = tenantRows(tenantsOf(g.id));
    return {g, rows, worst: rows[0] || null, due: sumDue(rows)};      // rows[0] is the most urgent tenant
  });
  const rank = x => x.worst ? RANK[x.worst.st] - (x.worst.old>0 ? 0.5 : 0) : 99;   // empty groups go last
  groups.sort((a,b)=> rank(a) - rank(b) || groupLabel(a.g).localeCompare(groupLabel(b.g)));
  return `${tip("help_home")}
    <h2 class="sec" style="margin-top:8px">${t("thisMonth",{m:monthName(curYm())})}</h2>
    <div class="sum" style="margin-top:10px">
      <div class="box green"><div class="lbl">${t("collected")}</div><div class="val">₹${num(sumPaid(all))}</div></div>
      <div class="box amber"><div class="lbl">${t("toCollect")}</div><div class="val">₹${num(sumDue(all))}</div></div>
    </div>
    <h2 class="sec">${t("groups")} (${groups.length})</h2>
    <div class="hint">${t("sortNote")}</div>
    ${groups.length ? groups.map(x=>`
      <button class="card tap" onclick="go('group',${x.g.id})">
        <div class="row"><span class="name">${esc(groupLabel(x.g))}</span>${x.worst ? chip(x.worst.st) : ""}</div>
        <div class="sub">${x.rows.length===1 ? t("grpOne") : x.rows.length ? t("grpCount",{n:x.rows.length}) : t("grpNoTenants")}${x.rows.length ? " · " + t("grpToReceive",{a:num(x.due)}) : ""}</div>
        ${x.rows.some(r=>r.old>0) ? `<span class="olddue"> ${t("oldDues",{a:num(x.rows.reduce((s,r)=>s+r.old,0))})}</span>` : ""}
      </button>`).join("") : `<div class="empty">${t("noGroups")}</div>`}
    <button class="btn" onclick="go('addGroup')">${t("addGroupBtn")}</button>`;
}

/* GROUP: the tenants of one group (this is the list Home used to show). */
function screenGroup(){
  const g = findGroup(S.param); if (!g) return "";
  const rows = tenantRows(tenantsOf(g.id));
  return `${tip("help_group")}
    ${g.locked ? `<div class="info">${t("defaultGroupNote")}</div>` : ""}
    <h2 class="sec" style="margin-top:8px">${t("thisMonth",{m:monthName(curYm())})}</h2>
    <div class="sum" style="margin-top:10px">
      <div class="box green"><div class="lbl">${t("collected")}</div><div class="val">₹${num(sumPaid(rows))}</div></div>
      <div class="box amber"><div class="lbl">${t("toCollect")}</div><div class="val">₹${num(sumDue(rows))}</div></div>
    </div>
    <h2 class="sec">${t("tenants")} (${rows.length})</h2>
    ${rows.length ? `<div class="hint">${t("sortNote")}</div>` : ""}
    ${rows.length ? rows.map(r=>`
      <button class="card tap" onclick="go('detail',${r.tn.id})">
        <div class="row"><span class="name">${esc(r.tn.name)}</span>${chip(r.st)}</div>
        ${r.old>0 ? `<span class="olddue"> ${t("oldDues",{a:num(r.old)})}</span>` : ""}
      </button>`).join("") : `<div class="empty">${t("noTenantsInGroup")}</div>`}
    <button class="btn" onclick="go('add',${g.id})">${t("addTenantBtn")}</button>
    ${g.locked ? "" : `<button class="btn secondary" onclick="go('renameGroup',${g.id})">${t("btn_renameGroup")}</button>
    <button class="btn danger small" style="margin-top:28px" onclick="askDeleteGroup(${g.id})">${t("btn_deleteGroup")}</button>`}`;
}

/* ----- Add / rename / delete a group ----- */
function groupNameHtml(){
  return `<label class="f" for="g_name">${t("f_gname")}</label><div class="hint">${t("f_gname_h")}</div>
    <input class="in" id="g_name" type="text" autocomplete="off" value="${esc(S.f.gname)}" oninput="S.f.gname=this.value">
    ${S.err==="gname" ? `<div class="err">${t("err_gname")}</div>`:""}
    ${S.err==="gnameTaken" ? `<div class="err">${t("err_gname_taken")}</div>`:""}`;
}
function screenAddGroup(){
  return `${tip("help_addGroup")}${groupNameHtml()}
    <button class="btn" onclick="saveGroup()"> ${t("save")}</button>
    <button class="btn secondary" onclick="back()">${t("cancel")}</button>`;
}
function screenRenameGroup(){
  return `${tip("help_renameGroup")}${groupNameHtml()}
    <button class="btn" onclick="saveGroupName()"> ${t("save")}</button>
    <button class="btn secondary" onclick="back()">${t("cancel")}</button>`;
}
function checkGroupName(except){      // returns an error code or ""
  const name = (S.f.gname||"").trim();
  if (!name) return "gname";
  if (liveGroups().some(g => g.id!==except && sameName(g.name, name))) return "gnameTaken";
  return "";
}
function saveGroup(){
  const bad = checkGroupName(-1); if (bad){ S.err = bad; render(); return; }
  const g = {id:S.nextGroupId++, name:S.f.gname.trim()};
  S.groups.push(g);
  toast(t("groupAdded",{n:g.name})); back();
}
function saveGroupName(){
  const g = findGroup(S.param), bad = checkGroupName(g.id); if (bad){ S.err = bad; render(); return; }
  g.name = S.f.gname.trim();
  toast(t("groupRenamed",{n:g.name})); back();
}
function askDeleteGroup(id){ S.dialog = {type:"deleteGroup", id}; render(); }
function doDeleteGroup(id){
  const g = findGroup(id);
  g.deleted = true;                            // soft delete, like tenants: archived tenants still point at it
  S.dialog = null; toast(t("groupDeleted",{n:g.name})); go("home", null, {reset:true});
}

/* ----- Move a tenant to another group ----- */
function askMove(id){ S.dialog = {type:"move", id}; render(); }
function doMove(id, gid){
  const tn = findTenant(id), g = findGroup(gid);
  tn.groupId = gid; S.dialog = null; toast(t("movedTo",{n:tn.name,g:groupLabel(g)})); render();
}

function screenAdd(){
  const months = []; for (let i=11;i>=0;i--) months.push(addMonth(curYm(),-i));
  const days = Array.from({length:31},(_,i)=>i+1);
  return `${tip("help_add")}
    <label class="f" for="f_name">${t("f_name")}</label><div class="hint">${t("f_name_h")}</div>
    <input class="in" id="f_name" type="text" autocomplete="off" value="${esc(S.f.name)}" oninput="S.f.name=this.value">
    ${S.err==="name" ? `<div class="err">${t("err_name")}</div>`:""}
    <label class="f" for="f_group">${t("f_group")}</label><div class="hint">${t("f_group_h")}</div>
    <select class="in" id="f_group" onchange="S.f.group=+this.value">${liveGroups().map(g=>`<option value="${g.id}" ${+S.f.group===g.id?"selected":""}>${esc(groupLabel(g))}</option>`).join("")}</select>
    <label class="f" for="f_rent">${t("f_rent")}</label><div class="hint">${t("f_rent_h")}</div>
    <input class="in" id="f_rent" type="text" inputmode="numeric" pattern="[0-9]*" value="${esc(S.f.rent)}" oninput="this.value=this.value.replace(/[^0-9]/g,'');S.f.rent=this.value">
    ${S.err==="rent" ? `<div class="err">${t("err_rent")}</div>`:""}
    <label class="f" for="f_due">${t("f_due")}</label><div class="hint">${t("f_due_h")}</div>
    <select class="in" id="f_due" onchange="S.f.due=this.value">${days.map(d=>`<option value="${d}" ${+S.f.due===d?"selected":""}>${d}</option>`).join("")}</select>
    <label class="f" for="f_start">${t("f_start")}</label><div class="hint">${t("f_start_h")}</div>
    <select class="in" id="f_start" onchange="S.f.start=this.value">${months.map(m=>`<option value="${m}" ${S.f.start===m?"selected":""}>${monthName(m)}</option>`).join("")}</select>
    <button class="btn" onclick="saveTenant()"> ${t("save")}</button>
    <button class="btn secondary" onclick="back()">${t("cancel")}</button>`;
}
function saveTenant(){
  const name = (S.f.name||"").trim(), rent = parseInt(S.f.rent,10);
  if (!name){ S.err="name"; render(); return; }
  if (!rent || rent<=0){ S.err="rent"; render(); return; }
  const tn = {id:S.nextId++, groupId:+S.f.group, name, dueDay:+S.f.due, rent, pendingRent:null, start:S.f.start, months:[{ym:S.f.start, required:rent, payments:[]}]};
  ensureMonths(tn); S.tenants.push(tn);
  // Replace the form with the tenant page, so Back returns to the screen the user came from (Home or the group).
  const prev = S.stack.pop(); if (prev){ S.screen = prev.screen; S.param = prev.param; }
  toast(t("tenantAdded",{n:name})); go("detail", tn.id);
}

function screenDetail(readonly=false){
  const tn = findTenant(S.param); if (!tn) return "";
  if (!readonly) ensureMonths(tn);
  const ms = visibleMonths(tn).slice().reverse();
  const cur = readonly ? ms[0] : monthOf(tn, curYm());
  const hist = readonly ? ms : ms.filter(m=>m.ym!==curYm());
  const old = oldDues(tn);
  let top = "";
  if (cur){
    const st = stateOf(tn,cur), paid = paidAsOf(cur,S.today), pct = Math.min(100, cur.required ? paid/cur.required*100 : 0);
    top = `<div class="card">
      <div class="row"><b>${monthName(cur.ym)}</b>${chip(st)}</div>
      <div class="sub">${t("sd_"+st)}</div>
      <div class="bar"><i style="width:${pct}%;background:var(--st-${st})"></i></div>
      <div class="row"><span>${t("received",{p:num(paid),r:num(cur.required)})}</span></div>
      ${remaining(cur)>0 ? `<div class="name" style="margin-top:6px">${t("balance",{a:num(remaining(cur))})}</div>` : ""}
      ${paid>cur.required ? `<div class="sub">${t("extraNote",{a:num(paid-cur.required)})}</div>` : ""}
      <div class="sub" style="margin-top:6px"> ${t("dueDate",{d:dayMonth(dueDateOf(cur.ym,tn.dueDay))})}</div>
    </div>`;
  }
  const histHtml = hist.length ? hist.map(m=>{ const st = stateOf(tn,m);
    return `<div class="hist"><div class="row"><span class="m">${monthName(m.ym)}</span>${chip(st)}</div>
      <div class="sub">${t("received",{p:num(paidAsOf(m,S.today)),r:num(m.required)})}</div>
      ${m.payments.map(p=>`<div class="sub">₹${num(p.amount)} · ${dayMonth(p.date)}</div>`).join("")}
      ${!readonly && remaining(m)>0 ? `<div class="sub" style="font-weight:700;color:var(--ink)">${t("balance",{a:num(remaining(m))})}</div><button class="btn secondary small" style="margin-top:6px" onclick="payFor(${tn.id},'${m.ym}')">${t("btn_payMonth")}</button>` : ""}</div>`; }).join("")
    : `<div class="sub" style="margin-top:8px">${t("noHistory")}</div>`;
  return `${readonly ? `<div class="banner"> ${t("arch_removedOn",{m:monthName(tn.removedOn)})}</div>` : tip("help_detail")}
    <div class="name" style="font-size:26px;margin-top:10px">${esc(tn.name)}</div>
    <div class="sub">${t("rentPerMonth",{a:num(cur?cur.required:tn.rent)})}</div>
    <div class="sub">${t("inGroup",{g:esc(groupLabel(findGroup(tn.groupId)))})}</div>
    ${top}
    ${!readonly && old>0 ? `<div class="info" style="background:#f6ecfd;border-color:#dbbdf2"><b>${t("oldDues",{a:num(old)})}</b><button class="btn small" style="margin-top:10px" onclick="payFor(${tn.id},'${oldestOwing(tn)}')">${t("btn_payOld")}</button></div>` : ""}
    ${!readonly && tn.pendingRent ? `<div class="info"> ${t("pendingRentNote",{m:monthName(tn.pendingRent.from),a:num(tn.pendingRent.amount)})}</div>` : ""}
    ${readonly ? "" : `<button class="btn" onclick="go('pay',${tn.id})"> ${t("btn_pay")}</button>
      <button class="btn secondary" onclick="go('rent',${tn.id})"> ${t("btn_rent")}</button>
      <button class="btn secondary" onclick="askMove(${tn.id})"> ${t("btn_moveGroup")}</button>`}
    <h2 class="sec">${t("history")}</h2><div class="card" style="margin-top:8px;padding-top:4px;padding-bottom:4px">${histHtml}</div>
    ${readonly ? "" : `<button class="btn danger small" style="margin-top:28px" onclick="askDelete(${tn.id})"> ${t("btn_delete")}</button>`}`;
}

/* ----- Record payment ----- */
function initPay(id){
  const tn = findTenant(id), ms = visibleMonths(tn);
  const owing = ms.filter(m=>remaining(m)>0);
  const month = monthOf(tn,curYm()) && remaining(monthOf(tn,curYm()))>0 ? curYm() : (owing[0] ? owing[0].ym : curYm());
  S.f = {amount:"", date:S.today, month};
}
function oldestOwing(tn){ const m = visibleMonths(tn).find(x=>x.ym<curYm() && remaining(x)>0); return m ? m.ym : curYm(); }
function payFor(id, ym){ go("pay", id); S.f.month = ym; render(); }
function payMonths(tn){ const ms = visibleMonths(tn).filter(m=>remaining(m)>0 || m.ym===curYm()); return ms.sort((a,b)=>a.ym<b.ym?1:-1); }
function payHintHtml(){
  const tn = findTenant(S.param), m = monthOf(tn,S.f.month), a = parseInt(S.f.amount,10);
  if (!a || a<=0) return "";
  const left = m.required - paidAsOf(m,S.today) - a;
  if (left>0) return `<div class="info">${t("pay_after",{a:num(left)})}</div>`;
  return `<div class="ok">${t("pay_afterDone")}</div>` + (left<0 ? `<div class="info">${t("pay_extra",{a:num(-left)})}</div>` : "");
}
function updatePayHint(){ const el = document.getElementById("payHint"); if (el) el.innerHTML = payHintHtml(); }
function screenPay(){
  const tn = findTenant(S.param), m = monthOf(tn,S.f.month), bal = remaining(m);
  return `${tip("help_pay")}
    <div class="name" style="margin-top:8px">${esc(tn.name)}</div>
    <label class="f" for="p_month">${t("pay_month")}</label><div class="hint">${t("pay_month_h")}</div>
    <select class="in" id="p_month" onchange="S.f.month=this.value;render()">${payMonths(tn).map(x=>`<option value="${x.ym}" ${x.ym===S.f.month?"selected":""}>${monthName(x.ym)} – ${t("balance",{a:num(remaining(x))})}</option>`).join("")}</select>
    <label class="f" for="p_amount">${t("pay_amount")}</label>
    <input class="in" id="p_amount" type="text" inputmode="numeric" pattern="[0-9]*" value="${esc(S.f.amount)}" oninput="this.value=this.value.replace(/[^0-9]/g,'');S.f.amount=this.value;updatePayHint()">
    ${S.err==="amount" ? `<div class="err">${t("err_amount")}</div>`:""}
    ${bal>0 ? `<button class="btn secondary small" onclick="S.f.amount='${bal}';render()">${t("pay_full",{a:num(bal)})}</button>` : ""}
    <div id="payHint">${payHintHtml()}</div>
    <label class="f" for="p_date">${t("pay_date")}</label>
    <input class="in" id="p_date" type="date" max="${S.today}" value="${S.f.date}" onchange="S.f.date=this.value||S.today">
    <button class="btn" onclick="savePay()"> ${t("save")}</button>
    <button class="btn secondary" onclick="back()">${t("cancel")}</button>`;
}
function savePay(){
  const a = parseInt(S.f.amount,10);
  if (!a || a<=0){ S.err="amount"; render(); return; }
  const tn = findTenant(S.param), m = monthOf(tn,S.f.month), p = {date:S.f.date||S.today, amount:a};
  m.payments.push(p);
  toast(t("paymentSaved",{a:num(a)}), ()=>{ m.payments = m.payments.filter(x=>x!==p); S.toast=null; render(); });
  S.stack.pop(); S.screen="detail"; render();
}

/* ----- Change rent ----- */
function rentHintHtml(){
  const tn = findTenant(S.param), m = monthOf(tn,curYm()), a = parseInt(S.f.rent,10);
  if (!a || a<=0) return "";
  const d = a - m.required, nextYm = addMonth(curYm(),1);
  const msg = d>0 ? t("rent_up",{a:num(d)}) : d<0 ? t("rent_down",{a:num(-d)}) : t("rent_same");
  return `<div class="info"><b>${msg}</b><br>${t("rent_notice",{m:monthName(nextYm),c:monthName(curYm()),a:num(m.required)})}</div>`;
}
function updateRentHint(){ const el = document.getElementById("rentHint"); if (el) el.innerHTML = rentHintHtml(); }
function screenRent(){
  const tn = findTenant(S.param), m = monthOf(tn,curYm());
  return `${tip("help_rent")}
    <div class="name" style="margin-top:8px">${esc(tn.name)}</div>
    <div class="sub">${t("rent_current",{a:num(m.required)})}</div>
    <label class="f" for="r_new">${t("rent_new")}</label>
    <input class="in" id="r_new" type="text" inputmode="numeric" pattern="[0-9]*" value="${esc(S.f.rent)}" oninput="this.value=this.value.replace(/[^0-9]/g,'');S.f.rent=this.value;updateRentHint()">
    ${S.err==="rent" ? `<div class="err">${t("err_rent")}</div>`:""}
    <div id="rentHint">${rentHintHtml()}</div>
    <button class="btn" onclick="saveRent()"> ${t("save")}</button>
    <button class="btn secondary" onclick="back()">${t("cancel")}</button>`;
}
function saveRent(){
  const a = parseInt(S.f.rent,10);
  if (!a || a<=0){ S.err="rent"; render(); return; }
  const tn = findTenant(S.param), from = addMonth(curYm(),1);
  tn.pendingRent = {amount:a, from};
  tn.months.forEach(m=>{ if (m.ym>=from) m.required = a; });   // any already-created future month follows the new rent
  toast(t("rentSaved",{m:monthName(from)})); back();
}

/* ----- Delete (archive) ----- */
function askDelete(id){ S.dialog = {type:"delete", id}; render(); }
function doDelete(id){
  const i = S.tenants.findIndex(x=>x.id===id), tn = S.tenants[i];
  S.tenants.splice(i,1); tn.removedOn = curYm(); S.archived.push(tn);       // an archived tenant keeps its group
  S.dialog = null; toast(t("removed",{n:tn.name})); back();                 // back to the group the tenant was in
}

/* ----- Settings / Archive / Welcome ----- */
let pressT = null;
function pressStart(){ pressT = setTimeout(()=>{ pressT=null; go("archive"); }, 800); }
function pressEnd(){ if (pressT){ clearTimeout(pressT); pressT=null; } }
function screenSettings(){
  return `${tip("help_settings")}
    <h2 class="sec" style="margin-top:8px"> ${t("set_lang")}</h2>
    <button class="choice ${S.lang==="en"?"on":""}" onclick="setLang('en')"><span class="dot"></span>English</button>
    <button class="choice ${S.lang==="kn"?"on":""}" onclick="setLang('kn')"><span class="dot"></span>ಕನ್ನಡ</button>
    <div class="card row" style="margin-top:20px"><span style="font-weight:700"> ${t("set_tips")}</span>
      <button class="switch ${S.tips?"on":""}" role="switch" aria-checked="${S.tips}" onclick="S.tips=!S.tips;localStorage.setItem('rb_tips',S.tips?'on':'off');render()"></button></div>
    <button class="btn secondary" onclick="S.wstep=0;go('welcome',null,{reset:true})"> ${t("set_welcome")}</button>
    <h2 class="sec">${t("set_about")}</h2>
    <div class="card"><b>${t("appName")}</b>
      <div class="sub" id="ver" style="user-select:none;padding:8px 0"
        onpointerdown="pressStart()" onpointerup="pressEnd()" onpointerleave="pressEnd()" oncontextmenu="return false">${t("version")}</div></div>`;
}
function screenArchive(){
  return `${tip("help_archive")}<div class="banner"> ${t("arch_note")}</div>
    ${S.archived.length ? S.archived.map(tn=>`
      <button class="card tap" onclick="go('archiveDetail',${tn.id})">
        <div class="name">${esc(tn.name)}</div>
        <div class="sub">${t("arch_removedOn",{m:monthName(tn.removedOn)})} · ${t("rentPerMonth",{a:num(tn.rent)})}</div></button>`).join("")
      : `<div class="empty">${t("arch_empty")}</div>`}`;
}
function screenWelcome(){
  const i = S.wstep, last = i===2;
  return `<div class="welcome"><div class="big">${i+1}</div>
    <h1>${t("w"+(i+1)+"_t")}</h1><p>${t("w"+(i+1)+"_b")}</p>
    <div class="dots">${[0,1,2].map(n=>`<i class="${n===i?"on":""}"></i>`).join("")}</div>
    <button class="btn" onclick="${last?"finishWelcome()":"S.wstep++;render()"}">${last?t("start"):t("next")}</button>
    ${last?"":`<button class="btn secondary" onclick="finishWelcome()">${t("skip")}</button>`}</div>`;
}
function finishWelcome(){ localStorage.setItem("rb_seenWelcome","1"); go("home", null, {reset:true}); }

/* ----- Help dialog / delete dialog ----- */
function showHelp(){ S.dialog = {type:"help", screen:S.screen}; render(); }
function dialogHtml(){
  const d = S.dialog; if (!d) return "";
  if (d.type==="help"){
    const key = {archiveDetail:"detail"}[d.screen] || d.screen;
    const legend = (d.screen==="home"||d.screen==="group"||d.screen==="detail"||d.screen==="archiveDetail") ? `<h3 style="font-size:18px;margin-top:14px">${t("legendTitle")}</h3>
      <div class="legend">${Object.keys(RANK).map(s=>`<div>${chip(s)}<br>${t("sd_"+s)}</div>`).join("")}</div>` : "";
    return `<div class="overlay" onclick="S.dialog=null;render()"><div class="dialog" onclick="event.stopPropagation()">
      <h3> ${t("help")}</h3><p>${t("help_"+key)}</p>${legend}
      <button class="btn" onclick="S.dialog=null;render()">${t("close")}</button></div></div>`;
  }
  if (d.type==="delete"){
    const tn = findTenant(d.id), owed = oldDues(tn) + remaining(monthOf(tn,curYm())) ;
    return `<div class="overlay"><div class="dialog">
      <h3> ${t("del_title",{n:esc(tn.name)})}</h3><p>${t("del_body",{n:esc(tn.name)})}</p>
      ${owed>0 ? `<div class="info" style="background:#fdeec2;border-color:#f0d27a"> ${t("del_owed",{a:num(owed)})}</div>`:""}
      <button class="btn secondary" onclick="S.dialog=null;render()">${t("del_no")}</button>
      <button class="btn danger" onclick="doDelete(${tn.id})">${t("del_yes")}</button></div></div>`;
  }
  if (d.type==="deleteGroup"){
    const g = findGroup(d.id), n = g ? tenantsOf(g.id).length : 0;
    // A group that still has tenants cannot be deleted: explain instead of asking.
    if (n>0) return `<div class="overlay"><div class="dialog">
      <h3> ${t("delg_title",{n:esc(g.name)})}</h3><div class="info" style="background:#fdeec2;border-color:#f0d27a">${t("delg_notEmpty")}</div>
      <button class="btn" onclick="S.dialog=null;render()">${t("close")}</button></div></div>`;
    return `<div class="overlay"><div class="dialog">
      <h3> ${t("delg_title",{n:esc(g.name)})}</h3><p>${t("delg_body")}</p>
      <button class="btn secondary" onclick="S.dialog=null;render()">${t("delg_no")}</button>
      <button class="btn danger" onclick="doDeleteGroup(${g.id})">${t("delg_yes")}</button></div></div>`;
  }
  if (d.type==="move"){
    const tn = findTenant(d.id);
    return `<div class="overlay" onclick="S.dialog=null;render()"><div class="dialog" onclick="event.stopPropagation()">
      <h3> ${t("move_title",{n:esc(tn.name)})}</h3><p>${t("move_body")}</p>
      ${liveGroups().map(g=>`<button class="choice ${g.id===tn.groupId?"on":""}" onclick="doMove(${tn.id},${g.id})"><span class="dot"></span>${esc(groupLabel(g))}</button>`).join("")}
      <button class="btn secondary" onclick="S.dialog=null;render()">${t("cancel")}</button></div></div>`;
  }
  return "";
}

/* =========================== RENDER =========================== */
function render(){
  const sc = S.screen;
  const titles = {home:t("appName"), group:"", addGroup:t("addGroupTitle"), renameGroup:t("renameGroupTitle"), add:t("addTitle"), detail:"", pay:t("pay_title"), rent:t("rent_title"), settings:t("set_title"), archive:t("arch_title"), archiveDetail:t("arch_title"), welcome:""};
  const bodies = {home:screenHome, group:screenGroup, addGroup:screenAddGroup, renameGroup:screenRenameGroup, add:screenAdd, detail:()=>screenDetail(false), pay:screenPay, rent:screenRent, settings:screenSettings, archive:screenArchive, archiveDetail:()=>screenDetail(true), welcome:screenWelcome};
  const tabs = ["home","settings"], isTab = tabs.includes(sc);
  let title = titles[sc];
  if (sc==="detail"||sc==="archiveDetail"){ const tn = findTenant(S.param); title = tn ? esc(tn.name) : ""; }
  if (sc==="group"){ const g = findGroup(S.param); title = g ? esc(groupLabel(g)) : ""; }
  const titleAttr = sc==="home" ? `onclick="homeTap()"` : "";
  const header = sc==="welcome" ? `<header class="top"><div class="title"></div><button class="icon-btn lang" onclick="toggleLang()">${t("langBtn")}</button></header>` :
    `<header class="top">
      ${isTab ? "" : `<button class="icon-btn back" onclick="back()" aria-label="Back">${t("back")}</button>`}
      <div class="title" ${titleAttr}>${title}</div>
      <button class="icon-btn" onclick="showHelp()" aria-label="Help">${t("help")}</button>
      <button class="icon-btn lang" onclick="toggleLang()">${t("langBtn")}</button></header>`;
  const nav = isTab ? `<nav class="bottom">${[["home"],["settings"]].map(([k])=>
    `<button class="${sc===k?"on":""}" onclick="tab('${k}')">${t("nav_"+k)}</button>`).join("")}</nav>` : "";
  const keepScroll = document.querySelector("main.screen")?.scrollTop || 0;
  document.getElementById("phone").innerHTML = `${header}<main class="screen">${bodies[sc]()}</main>${nav}${dialogHtml()}` +
    (S.toast ? `<div class="toast"><span>${esc(S.toast.msg)}</span>${S.toast.undo?`<button onclick="S.toast.undo()">${t("undo")}</button>`:""}</div>` : "");
  const m = document.querySelector("main.screen"); if (m) m.scrollTop = keepScroll;
  document.getElementById("demoDate").value = S.today;
}
function homeTap(){ S.taps++; clearTimeout(S.tapT); S.tapT = setTimeout(()=>S.taps=0, 2000); if (S.taps>=5){ S.taps=0; go("archive"); } }

document.documentElement.lang = S.lang;
render();
</script>
</body>
</html>
